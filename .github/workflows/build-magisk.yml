name: Build PingPong Magisk Module

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-effect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip android-ndk-r25c-linux.zip
          echo "NDK_HOME=$(pwd)/android-ndk-r25c" >> $GITHUB_ENV

      - name: Compile C++ Effect
        run: |
          cd effect
          $NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_PLATFORM=android-33 APP_ABI=arm64-v8a

      - name: Package Magisk Module
        run: |
          # 1. Place library in SYSTEM partition (Magisk mounts this perfectly)
          mkdir -p magisk_module/system/lib64/soundfx
          cp effect/libs/arm64-v8a/libpingpong.so magisk_module/system/lib64/soundfx/
          
          # 2. Create module.prop
          echo "id=pingpong_dsp" > magisk_module/module.prop
          echo "name=PingPong DSP" >> magisk_module/module.prop
          echo "version=v1.8" >> magisk_module/module.prop
          echo "versionCode=9" >> magisk_module/module.prop
          echo "author=You" >> magisk_module/module.prop
          echo "description=Global PingPong Audio Effect" >> magisk_module/module.prop

          # 3. THE MAGIC FIX: Create post-fs-data.sh (runs EARLY, before audioserver starts)
          python3 -c "
          import os
          script = '''#!/system/bin/sh
          MODDIR=\${0%/*}
          VENDOR_LIB=\"/vendor/lib64/soundfx/libpingpong.so\"
          EFFECTS_XML=\"/vendor/etc/audio_effects.xml\"

          # Wait briefly for vendor partition to be fully mounted
          sleep 2

          # Make vendor writable
          mount -o rw,remount /vendor

          # 1. Copy library to vendor with correct SELinux context
          if [ -f \"\$MODDIR/system/lib64/soundfx/libpingpong.so\" ]; then
              cp \"\$MODDIR/system/lib64/soundfx/libpingpong.so\" \"\$VENDOR_LIB\"
              chmod 644 \"\$VENDOR_LIB\"
              chcon u:object_r:vendor_file:s0 \"\$VENDOR_LIB\"
          fi

          # 2. Patch XML if not already done
          if ! grep -q \"libpingpong.so\" \"\$EFFECTS_XML\"; then
              cp \"\$EFFECTS_XML\" /data/local/tmp/audio_effects.xml
              sed 's|<libraries>|<libraries>\\n        <library name=\"pingpong\" path=\"libpingpong.so\"/>|' /data/local/tmp/audio_effects.xml > /data/local/tmp/audio_effects_new.xml
              sed 's|<effects>|<effects>\\n        <effect name=\"pingpong\" library=\"pingpong\" uuid=\"12345678-1234-1234-1234-123456789abc\"/>|' /data/local/tmp/audio_effects_new.xml > \"\$EFFECTS_XML\"
              chmod 644 \"\$EFFECTS_XML\"
          fi

          # Make vendor read-only again
          mount -o ro,remount /vendor
          '''
          with open('magisk_module/post-fs-data.sh', 'w') as f:
              f.write(script)
          os.chmod('magisk_module/post-fs-data.sh', 0o755)
          "

          # 4. Create sepolicy.rule just in case
          cat <<'EOF' > magisk_module/sepolicy.rule
          allow hal_audio_default system_file:file { read open execute execute_no_trans map };
          allow hal_audio_default vendor_file:file { read open execute execute_no_trans map };
          EOF

          cd magisk_module
          zip -r ../PingPong-Magisk-Module.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PingPong-Magisk-Module
          path: PingPong-Magisk-Module.zip

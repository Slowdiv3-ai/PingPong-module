name: Build PingPong Magisk Module

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-effect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Android NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip android-ndk-r25c-linux.zip
          echo "NDK_HOME=$(pwd)/android-ndk-r25c" >> $GITHUB_ENV

      - name: Compile C++ Effect
        run: |
          cd effect
          $NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_PLATFORM=android-33 APP_ABI=arm64-v8a

      - name: Package Magisk Module
        run: |
          # CRITICAL FIX: Place library in vendor partition for correct SELinux context
          mkdir -p magisk_module/vendor/lib64/soundfx
          cp effect/libs/arm64-v8a/libpingpong.so magisk_module/vendor/lib64/soundfx/
          
          # Create module.prop
          echo "id=pingpong_dsp" > magisk_module/module.prop
          echo "name=PingPong DSP" >> magisk_module/module.prop
          echo "version=v1.2" >> magisk_module/module.prop
          echo "versionCode=3" >> magisk_module/module.prop
          echo "author=You" >> magisk_module/module.prop
          echo "description=Global PingPong Audio Effect" >> magisk_module/module.prop

          # Create the boot script to patch the REAL audio_effects.xml
          cat <<'EOF' > magisk_module/service.sh
#!/system/bin/sh
MODDIR=${0%/*}
EFFECTS_XML="/vendor/etc/audio_effects.xml"

# Wait for boot to finish
until [ "$(getprop sys.boot_completed)" = "1" ]; do
    sleep 1
done
sleep 10

# Make vendor writable
mount -o rw,remount /vendor

# Backup original file if not already backed up
if [ ! -f "$EFFECTS_XML.bak" ]; then
    cp "$EFFECTS_XML" "$EFFECTS_XML.bak"
fi

# Check if our effect is already there
if ! grep -q "libpingpong.so" "$EFFECTS_XML"; then
    # Copy to temp location, edit, then copy back (to avoid sed temp file issues)
    cp "$EFFECTS_XML" /data/local/tmp/audio_effects.xml
    sed 's|<libraries>|<libraries>\n        <library name="pingpong" path="libpingpong.so"/>|' /data/local/tmp/audio_effects.xml > /data/local/tmp/audio_effects_new.xml
    sed 's|<effects>|<effects>\n        <effect name="pingpong" library="pingpong" uuid="12345678-1234-1234-1234-123456789abc"/>|' /data/local/tmp/audio_effects_new.xml > "$EFFECTS_XML"
    chmod 644 "$EFFECTS_XML"
    
    # Restart the audio server to apply changes
    setprop ctl.restart audioserver
fi

# Make vendor read-only again
mount -o ro,remount /vendor
EOF
          chmod 755 magisk_module/service.sh
          sed -i 's/\r$//' magisk_module/service.sh

          cd magisk_module
          zip -r ../PingPong-Magisk-Module.zip .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PingPong-Magisk-Module
          path: PingPong-Magisk-Module.zip
